name: Native launcher validation
on:
  push:
    branches: ['main', 'codex/performance-spike']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure trusted mirror and toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE/.cargo" | Out-Null
          @'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'
          [source.rsproxy-sparse]
          registry = 'sparse+https://rsproxy.cn/index/'
          '@ | Set-Content "$env:USERPROFILE/.cargo/config.toml"
          function Invoke-Mirror([string]$Program, [string[]]$Arguments) {
            $process = Start-Process -FilePath $Program -ArgumentList $Arguments -PassThru -NoNewWindow
            if (!$process.WaitForExit(90000)) {
              $process.Kill($true)
              $process.WaitForExit()
              return $false
            }
            return $process.ExitCode -eq 0
          }
          $toolchain = @('toolchain', 'install', '1.99.1', '--profile', 'minimal', '--component', 'rustfmt,clippy')
          if (!(Invoke-Mirror 'rustup' $toolchain)) {
            Write-Warning 'Mirror failed; retrying the same pinned version from the official distribution.'
            $env:RUSTUP_DIST_SERVER='https://static.rust-lang.org'
            $env:RUSTUP_UPDATE_ROOT='https://static.rust-lang.org/rustup'
            rustup @toolchain
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          rustc -Vv
          if (!(Invoke-Mirror 'cargo' @('fetch', '--locked'))) {
            Remove-Item "$env:USERPROFILE/.cargo/config.toml" -ErrorAction SilentlyContinue
            cargo fetch --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        timeout-minutes: 4
        run: python scripts/test_watchdog.py
      - name: Lints
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin ALTRunNext
      - name: Test startup and settings with the release executable
        timeout-minutes: 2
        run: |
          $env:ALTRUN_RELEASE_SMOKE_EXE = (Resolve-Path target/x86_64-pc-windows-msvc/release/ALTRunNext.exe).Path
          cargo test --locked --test review_startup_hotkeys --test complete_native --test manager
      - name: Package launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ALTRunNext.exe dist/ALTRunNext.exe
          Copy-Item assets/Popup.wav dist/
          Copy-Item languages dist/languages -Recurse
          $metadata = cargo metadata --format-version 1 --locked --offline | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notices = 'dist/THIRD-PARTY-NOTICES.txt'
          'ALTRunNext third-party notices' | Set-Content -Encoding utf8 $notices
          'Popup.wav — original ALTRun sound (etworker), https://github.com/etworker/ALTRun/blob/master/Bin/Popup.wav' | Add-Content -Encoding utf8 $notices
          foreach ($package in $metadata.packages | Where-Object { $_.source }) {
            $source = Split-Path $package.manifest_path
            $licenses = @(Get-ChildItem $source -File | Where-Object { $_.Name -match '^(LICENSE|LICENCE|COPYING|NOTICE)([-.]|$)' })
            if ($licenses.Count -eq 0) { throw "Missing dependency license: $($package.name)" }
            foreach ($license in $licenses) {
              Add-Content -Encoding utf8 $notices "`n$($package.name) $($package.version) — $($license.Name)`n"
              Get-Content -Raw -LiteralPath $license.FullName | Add-Content -Encoding utf8 $notices
            }
          }
          Compress-Archive -LiteralPath @('dist/ALTRunNext.exe', 'dist/languages', 'dist/Popup.wav', $notices) -DestinationPath target/ALTRunNext-Win11-x64.zip
          "${{ github.sha }}" | Set-Content dist/COMMIT.txt
          @(Get-ChildItem dist -Recurse -File | ForEach-Object { @{Name=[IO.Path]::GetRelativePath((Join-Path $PWD dist),$_.FullName);Hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash} }) | ConvertTo-Json | Set-Content dist/SHA256.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: altrunnext-${{ github.sha }}
          path: |
            dist/
            target/ALTRunNext-Win11-x64.zip
            Cargo.lock
            target/ui/
            target/test-progress.log
          retention-days: 3
