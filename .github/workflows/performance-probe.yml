name: Native performance probe
on:
  push:
    branches: ['codex/performance-spike']
    paths: ['src/**', 'tests/**', 'Cargo.*', 'rust-toolchain.toml', 'scripts/**', '.github/workflows/performance-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure trusted mirror and toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE/.cargo" | Out-Null
          @'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'
          [source.rsproxy-sparse]
          registry = 'sparse+https://rsproxy.cn/index/'
          '@ | Set-Content "$env:USERPROFILE/.cargo/config.toml"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Mirror failed; retrying the same pinned version from the official distribution.'
            $env:RUSTUP_DIST_SERVER='https://static.rust-lang.org'
            $env:RUSTUP_UPDATE_ROOT='https://static.rust-lang.org/rustup'
            rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          rustc -Vv
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) {
            Remove-Item "$env:USERPROFILE/.cargo/config.toml"
            cargo fetch --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Formatting
        if: always()
        shell: pwsh
        run: |
          cargo fmt --all --check
      - name: Unit tests (performance gate logic)
        if: ${{ !cancelled() }}
        run: cargo test --locked
      - name: Evidence gate tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Lints
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package prototype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/*.exe dist/
          Copy-Item Cargo.lock dist/
          "${{ github.sha }}" | Set-Content dist/COMMIT.txt
          @(Get-ChildItem dist/*.exe | ForEach-Object { @{Name=$_.Name;Hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash} }) | ConvertTo-Json | Set-Content dist/SHA256.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: altrun-probe-${{ github.sha }}
          path: |
            dist/
            Cargo.lock
          retention-days: 3
