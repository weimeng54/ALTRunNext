name: Native performance probe
on:
  push:
    branches: ['codex/performance-spike']
    paths: ['src/**', 'tests/**', 'tools/**', 'Cargo.*', 'rust-toolchain.toml', 'scripts/**', '.github/workflows/performance-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure trusted mirror and toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE/.cargo" | Out-Null
          @'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'
          [source.rsproxy-sparse]
          registry = 'sparse+https://rsproxy.cn/index/'
          '@ | Set-Content "$env:USERPROFILE/.cargo/config.toml"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Mirror failed; retrying the same pinned version from the official distribution.'
            $env:RUSTUP_DIST_SERVER='https://static.rust-lang.org'
            $env:RUSTUP_UPDATE_ROOT='https://static.rust-lang.org/rustup'
            rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          rustc -Vv
          if (Test-Path .github/refresh-cargo-lock) {
            cargo generate-lockfile
            if ($LASTEXITCODE -ne 0) {
              Remove-Item "$env:USERPROFILE/.cargo/config.toml" -ErrorAction SilentlyContinue
              cargo generate-lockfile
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) {
            Remove-Item "$env:USERPROFILE/.cargo/config.toml"
            cargo fetch --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Formatting
        if: always()
        shell: pwsh
        run: |
          cargo fmt --all --check
          $formatExit = $LASTEXITCODE
          if ($formatExit -ne 0) {
            cargo fmt --all
            git diff --binary -- src tests build.rs | Out-File -Encoding utf8NoBOM rustfmt.patch
            # Tests/build must use committed source, even when formatting fails.
            git restore --source=HEAD --worktree -- src tests build.rs
            exit $formatExit
          }
      - name: Desktop-frame observer self-test
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64
          if errorlevel 1 exit /b 1
          if not exist target mkdir target
          cl.exe /nologo /O2 /MT /EHsc /W4 /WX /std:c++20 /Fe:target\altrun-frame-calibrate.exe /Fo:target\altrun-frame-calibrate.obj tools\altrun-frame-calibrate.cpp /link /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup
          if errorlevel 1 exit /b 1
          if errorlevel 1 exit /b 1
          cl.exe /nologo /O2 /MT /EHsc /W4 /WX /std:c++20 /LD /Fe:target\altrun-frame-capture.dll /Fo:target\frame_capture.obj tools\frame_capture.cpp /link /IMPLIB:target\frame_capture.lib
          if errorlevel 1 exit /b 1
          cl.exe /nologo /O2 /MT /EHsc /W4 /WX /std:c++20 /Fe:target\frame_capture_test.exe /Fo:target\frame_capture_test.obj tools\frame_capture_test.cpp
          if errorlevel 1 exit /b 1
          target\frame_capture_test.exe
          if errorlevel 1 exit /b 1
          if not exist target\debug\deps mkdir target\debug\deps
          copy /y target\altrun-frame-capture.dll target\debug\deps\altrun-frame-capture.dll
          copy /y target\altrun-frame-capture.dll target\debug\altrun-frame-capture.dll
          cl.exe /nologo /O2 /MT /EHsc /W4 /WX /std:c++20 /LD /Fe:target\debug\deps\frame_capture_fixture.dll /Fo:target\frame_capture_fixture.obj tests\native\frame_capture_fixture.cpp /link /IMPLIB:target\frame_capture_fixture.lib
          if errorlevel 1 exit /b 1
          cl.exe /nologo /O2 /MT /EHsc /W4 /WX /std:c++20 /LD /DALTRUN_BAD_ABI /Fe:target\debug\deps\frame_capture_badabi.dll /Fo:target\frame_capture_badabi.obj tests\native\frame_capture_fixture.cpp /link /IMPLIB:target\frame_capture_badabi.lib
          if errorlevel 1 exit /b 1
          cl.exe /nologo /O2 /MT /EHsc /W4 /WX /std:c++20 /LD /DALTRUN_POISON_POINTER=1 /Fe:target\debug\deps\frame_capture_poison_1.dll /Fo:target\frame_capture_poison_1.obj tests\native\frame_capture_fixture.cpp /link /IMPLIB:target\frame_capture_poison_1.lib
          if errorlevel 1 exit /b 1
          cl.exe /nologo /O2 /MT /EHsc /W4 /WX /std:c++20 /LD /DALTRUN_POISON_POINTER=2 /Fe:target\debug\deps\frame_capture_poison_2.dll /Fo:target\frame_capture_poison_2.obj tests\native\frame_capture_fixture.cpp /link /IMPLIB:target\frame_capture_poison_2.lib
          if errorlevel 1 exit /b 1
          cl.exe /nologo /O2 /MT /EHsc /W4 /WX /std:c++20 /LD /DALTRUN_POISON_POINTER=3 /Fe:target\debug\deps\frame_capture_poison_3.dll /Fo:target\frame_capture_poison_3.obj tests\native\frame_capture_fixture.cpp /link /IMPLIB:target\frame_capture_poison_3.lib
          if errorlevel 1 exit /b 1
          cl.exe /nologo /O2 /MT /EHsc /W4 /WX /std:c++20 /LD /DALTRUN_POISON_POINTER=4 /Fe:target\debug\deps\frame_capture_poison_4.dll /Fo:target\frame_capture_poison_4.obj tests\native\frame_capture_fixture.cpp /link /IMPLIB:target\frame_capture_poison_4.lib
          if errorlevel 1 exit /b 1
          target\altrun-frame-calibrate.exe --self-test --output "%CD%\target\frame-self-test.json"
      - name: Unit tests (performance gate logic)
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast
      - name: Evidence gate tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Lints
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package prototype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/*.exe dist/
          Copy-Item target/altrun-frame-calibrate.exe dist/
          Copy-Item target/altrun-frame-capture.dll dist/
          Copy-Item Cargo.lock dist/
          "${{ github.sha }}" | Set-Content dist/COMMIT.txt
          @(Get-ChildItem dist/* -File | Where-Object { $_.Extension -in '.exe','.dll' } | ForEach-Object { @{Name=$_.Name;Hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash} }) | ConvertTo-Json | Set-Content dist/SHA256.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: altrun-probe-${{ github.sha }}
          path: |
            dist/
            Cargo.lock
            rustfmt.patch
            target/ui/
            target/frame-self-test.json
          retention-days: 3
