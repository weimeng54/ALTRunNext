[package]
name = "altrun-probe"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
regex-lite = "=0.1.9"
fancy-regex = "=0.16.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"


